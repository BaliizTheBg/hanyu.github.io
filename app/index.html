<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hanyu">
  <meta name="theme-color" content="#0a0a0b">
  <script>
    // The GitHub-hosted app has been retired. The migration page can export this origin's
    // IndexedDB progress before the learner imports it into Hanyu86.
    if (/\.github\.io$/.test(location.hostname)) location.replace(new URL("moved.html", location.href));
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/kai.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="ui.css">
  <title>Hanyu</title>
</head>
<body>
  <main id="app">
    <div class="loading" role="status">
      <img src="icons/icon-180.png" alt="" width="88" height="88">
      <p class="loading-text">Loading Hanyu…</p>
      <div class="loading-bar"><div></div></div>
      <p class="loading-note">The first time takes a little longer: the words and books are saved on your phone.</p>
    </div>
  </main>
  <nav class="tabbar" id="tabbar" hidden></nav>
  <script type="module">
    if (!/\.github\.io$/.test(location.hostname)) import("./ui.js");
  </script>
</body>
</html>
