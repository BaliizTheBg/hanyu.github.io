<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hanyu">
  <meta name="theme-color" content="#0a0a0b">
  <script>
    // On the GitHub address (needs a VPN in China), someone new is sent to https://hanyu86.com.
    // Not sent: the installed app (from the Home Screen or Dock), and a browser that already has
    // Hanyu progress on this device, so the people already on GitHub keep their app and progress.
    (function () {
      if (!/\.github\.io$/.test(location.hostname)) return;
      var installed = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
      if (installed || !window.indexedDB || !indexedDB.databases) return;
      indexedDB.databases().then(function (dbs) {
        if (!dbs.some(function (d) { return d.name === "hanyu"; })) location.replace("https://hanyu86.com/app/");
      }).catch(function () {});
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/kai.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="ui.css">
  <title>Hanyu</title>
</head>
<body>
  <main id="app">
    <div class="loading" role="status">
      <img src="icons/icon-180.png" alt="" width="88" height="88">
      <p class="loading-text">Loading Hanyu…</p>
      <div class="loading-bar"><div></div></div>
      <p class="loading-note">The first time takes a little longer: the words and books are saved on your phone.</p>
    </div>
  </main>
  <nav class="tabbar" id="tabbar" hidden></nav>
  <script type="module" src="ui.js"></script>
</body>
</html>
